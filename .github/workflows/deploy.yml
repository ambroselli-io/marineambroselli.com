name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: deployer
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          cd /var/www/marineambroselli.com
          git fetch origin main
          git reset --hard origin/main

          # API de prise de rdv (server/) : dépendances + redémarrage pm2
          cd server
          npm ci --omit=dev
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          cd ..

          sleep 2
          if curl -fsS -o /dev/null --resolve marineambroselli.com:443:127.0.0.1 https://marineambroselli.com/ \
            && curl -fsS -o /dev/null --resolve marineambroselli.com:443:127.0.0.1 https://marineambroselli.com/api/health; then
            echo "Site and API are up."
          else
            echo "Site or API is not responding."
            exit 1
          fi
